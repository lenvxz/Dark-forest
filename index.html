const elTekst = document.getElementById('printer-text');
const elNaglowek = document.getElementById('wstep-text');
const btnStart = document.getElementById('start');
const btnRestart = document.getElementById('restart-btn');
const infoSpacja = document.getElementById('skip-info');
const kontenerWyborow = document.getElementById('wybory-container');
const audio = document.getElementById('tlo-muzyka');

let aktualnyTekst = "";
let indeks = 0;
let interwal = null;
let czyPisze = false;
let etapGry = "prolog";

function rozpocznijWypisywanie(tekst) {
    clearInterval(interwal);
    aktualnyTekst = tekst;
    elTekst.textContent = "";
    indeks = 0;
    czyPisze = true;

    elTekst.classList.add('typing-active');
    kontenerWyborow.style.display = 'none';

    if (btnRestart) {
        btnRestart.style.display = 'none';
    }

    infoSpacja.style.display = 'block';
    infoSpacja.textContent = 'Wciśnij SPACJĘ, aby przyspieszyć.';

    interwal = setInterval(() => {
        if (indeks < aktualnyTekst.length) {
            elTekst.textContent += aktualnyTekst.charAt(indeks);
            indeks++;
        } else {
            zakonczPisanie();
        }
    }, 25);
}

function zakonczPisanie() {
    clearInterval(interwal);
    czyPisze = false;
    elTekst.classList.remove('typing-active');
    sprawdzDalszeKroki();
}

function sprawdzDalszeKroki() {
    if (etapGry === "prolog") {
        infoSpacja.textContent = 'Wciśnij SPACJĘ, aby przejść dalej.';
    } else if (etapGry === "scena1") {
        pokazWybory(FABULA.scena1.wybory, (wybor) => {
            etapGry = "reakcja_drzewo";
            elNaglowek.style.display = 'none';
            rozpocznijWypisywanie(wybor.reakcja);
        });
    } else if (etapGry === "reakcja_drzewo") {
        infoSpacja.textContent = 'Wciśnij SPACJĘ, aby wejść w głąb lasu.';
    } else if (etapGry === "jagody") {
        pokazWybory(FABULA.jagody.wybory, (wybor) => {
            if (wybor.akcja === "zjedz") {
                etapGry = "zjedz_jagody";
                elNaglowek.style.display = 'block';
                elNaglowek.textContent = FABULA.zjedz_jagody.naglowek;
                rozpocznijWypisywanie(FABULA.zjedz_jagody.tekst);
            } else if (wybor.akcja === "zerwij") {
                etapGry = "zerwij_jagody";
                elNaglowek.style.display = 'block';
                elNaglowek.textContent = FABULA.zerwij_jagody.naglowek;

function pokazWybory(opcje, onSelect) {
    infoSpacja.style.display = 'none';
    kontenerWyborow.innerHTML = "";
    kontenerWyborow.style.display = "flex";

    opcje.forEach(opcja => {
        const btn = document.createElement("button");
        btn.className = "przycisk-wyboru";
        btn.textContent = opcja.label;
        btn.onclick = () => {
            kontenerWyborow.style.display = 'none';
            onSelect(opcja);
        };
        kontenerWyborow.appendChild(btn);
    });
}

function tekst() {
    if (audio) {
        audio.play().catch(() => {});
    }
    if (btnStart) {
        btnStart.style.display = 'none';
    }
    elNaglowek.style.display = 'block';
    elNaglowek.textContent = FABULA.prolog.naglowek;
    etapGry = "prolog";
    rozpocznijWypisywanie(FABULA.prolog.tekst);
}

function restartGry() {
    if (btnRestart) {
        btnRestart.style.display = 'none';
    }
    elNaglowek.style.display = 'block';
    elNaglowek.textContent = FABULA.prolog.naglowek;
    etapGry = "prolog";
    rozpocznijWypisywanie(FABULA.prolog.tekst);
}

window.addEventListener('keydown', (event) => {
    if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault();

        if (czyPisze) {
            elTekst.textContent = aktualnyTekst;
            zakonczPisanie();

            elNaglowek.textContent = FABULA.jagody.naglowek;
            rozpocznijWypisywanie(FABULA.jagody.tekst);
        }
    }
});
